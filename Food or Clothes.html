<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Food vs. Clothing Sorter</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: #f7fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .screen {
      width: 100%;
      max-width: 700px;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .screen.active {
      display: flex;
    }

    /* --- Start Screen --- */
    .card {
      background: #ffffff;
      border: 6px solid #3182ce;
      border-radius: 28px;
      padding: 30px 20px;
      text-align: center;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      margin-top: 20px;
    }

    .big-btn {
      background-color: #38a169;
      color: #ffffff;
      font-size: 36px;
      font-weight: 900;
      border: none;
      border-radius: 24px;
      padding: 24px 48px;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      margin-top: 20px;
      width: 100%;
    }

    .big-btn:active {
      transform: scale(0.96);
    }

    /* --- Play Dashboard --- */
    .dashboard {
      width: 100%;
      background: #ffffff;
      border: 3px solid #e2e8f0;
      border-radius: 20px;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .dash-stat {
      font-size: 26px;
      font-weight: 900;
      color: #2b6cb0;
    }

    /* Target Item Display */
    .target-box {
      background: #ffffff;
      border: 6px solid #3182ce;
      border-radius: 28px;
      width: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }

    .target-symbol {
      font-size: 110px;
      line-height: 1;
    }

    .target-label {
      font-size: 34px;
      font-weight: 900;
      color: #1a202c;
      margin-top: 12px;
    }

    /* 2 Big Choice Buttons */
    .choices-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
    }

    .choice-card {
      background: #ffffff;
      border: 6px solid #cbd5e0;
      border-radius: 28px;
      padding: 24px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
      transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
    }

    .choice-card:active {
      transform: scale(0.95);
    }

    .choice-symbol {
      font-size: 80px;
      line-height: 1;
    }

    .choice-label {
      font-size: 28px;
      font-weight: 900;
      color: #2d3748;
      margin-top: 12px;
      text-transform: uppercase;
    }

    /* Touch Feedback Flashes */
    .choice-card.flash-correct {
      background-color: #c6f6d5 !important;
      border-color: #38a169 !important;
    }

    .choice-card.flash-wrong {
      background-color: #fed7d7 !important;
      border-color: #e53e3e !important;
    }

    /* --- Summary Screen --- */
    .summary-card {
      background: #ffffff;
      border: 6px dashed #3182ce;
      border-radius: 28px;
      padding: 28px 20px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .summary-title {
      font-size: 38px;
      font-weight: 900;
      color: #2b6cb0;
      margin: 10px 0;
    }

    .screenshot-banner {
      background: #ebf8ff;
      border: 3px solid #3182ce;
      border-radius: 16px;
      padding: 14px;
      font-size: 22px;
      font-weight: 800;
      color: #2b6cb0;
      margin: 16px 0;
    }

    .stats-row {
      display: flex;
      justify-content: space-around;
      background: #f7fafc;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: 800;
      color: #2d3748;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      text-align: left;
      margin-bottom: 24px;
    }

    .summary-item {
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <!-- 1. START SCREEN -->
  <div class="screen active" id="startScreen">
    <div class="card">
      <div style="font-size: 90px;">🍎 👕</div>
      <h1 style="font-size: 36px; color: #2b6cb0; margin: 10px 0;">Food or Clothes?</h1>
      <p style="font-size: 22px; color: #4a5568;">Sort 20 items into Food or Clothes!</p>
      <button class="big-btn" onclick="startGame()">▶ START</button>
    </div>
  </div>

  <!-- 2. PLAY SCREEN -->
  <div class="screen" id="playScreen">
    <div class="dashboard">
      <div class="dash-stat" id="scoreText">Score: 0</div>
      <div class="dash-stat" id="timerText">⏱️ 0s</div>
      <div class="dash-stat" id="progressText">1 / 20</div>
    </div>

    <!-- Active Target Item -->
    <div class="target-box">
      <div class="target-symbol" id="targetSymbol">❓</div>
      <div class="target-label" id="targetLabel">Item</div>
    </div>

    <!-- 2 Choice Cards -->
    <div class="choices-container">
      <div class="choice-card" id="card-food" style="border-color: #38a169;" onclick="handleSort('food', this)">
        <div class="choice-symbol">🍎</div>
        <div class="choice-label">Food</div>
      </div>

      <div class="choice-card" id="card-clothes" style="border-color: #3182ce;" onclick="handleSort('clothes', this)">
        <div class="choice-symbol">👕</div>
        <div class="choice-label">Clothes</div>
      </div>
    </div>
  </div>

  <!-- 3. SUMMARY SCREEN -->
  <div class="screen" id="summaryScreen">
    <div class="summary-card">
      <div style="font-size: 80px;">🎉 🌟 🎉</div>
      <div class="summary-title">GREAT JOB!</div>
      
      <div class="screenshot-banner">📸 PLEASE TAKE A SCREENSHOT NOW</div>

      <div class="stats-row">
        <div>Score: <span id="finalScore">20/20</span></div>
        <div>Time: <span id="finalTime">30s</span></div>
      </div>

      <div class="summary-grid" id="summaryGrid"></div>

      <button class="big-btn" onclick="startGame()">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const TOTAL_ITEMS = 20;

    // Item Pool (Food vs Clothes)
    const ITEM_POOL = [
      // Food Items
      { name: 'Apple', symbol: '🍎', cat: 'food' },
      { name: 'Banana', symbol: '🍌', cat: 'food' },
      { name: 'Pizza', symbol: '🍕', cat: 'food' },
      { name: 'Bread', symbol: '🍞', cat: 'food' },
      { name: 'Carrot', symbol: '🥕', cat: 'food' },
      { name: 'Cookie', symbol: '🍪', cat: 'food' },
      { name: 'Milk', symbol: '🥛', cat: 'food' },
      { name: 'Strawberry', symbol: '🍓', cat: 'food' },
      { name: 'Corn', symbol: '🌽', cat: 'food' },
      { name: 'Hamburger', symbol: '🍔', cat: 'food' },

      // Clothes Items
      { name: 'Shirt', symbol: '👕', cat: 'clothes' },
      { name: 'Socks', symbol: '🧦', cat: 'clothes' },
      { name: 'Pants', symbol: '👖', cat: 'clothes' },
      { name: 'Hat', symbol: '🧢', cat: 'clothes' },
      { name: 'Dress', symbol: '👗', cat: 'clothes' },
      { name: 'Jacket', symbol: '🧥', cat: 'clothes' },
      { name: 'Shoes', symbol: '👟', cat: 'clothes' },
      { name: 'Scarf', symbol: '🧣', cat: 'clothes' },
      { name: 'Shorts', symbol: '🩳', cat: 'clothes' },
      { name: 'Gloves', symbol: '🧤', cat: 'clothes' }
    ];

    let currentRoundItems = [];
    let currentIndex = 0;
    let score = 0;
    let secondsElapsed = 0;
    let timerInterval = null;
    let sortedHistory = [];
    let isProcessing = false;

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.rate = 0.85; // Slightly slower pace for accessibility
        window.speechSynthesis.speak(msg);
      }
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function startGame() {
      // Shuffle & pick 20 items
      currentRoundItems = [...ITEM_POOL].sort(() => 0.5 - Math.random()).slice(0, TOTAL_ITEMS);
      currentIndex = 0;
      score = 0;
      secondsElapsed = 0;
      sortedHistory = [];
      isProcessing = false;

      // Reset Dashboard
      document.getElementById('scoreText').innerText = `Score: 0`;
      document.getElementById('timerText').innerText = `⏱️ 0s`;
      
      // Start Timer
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        document.getElementById('timerText').innerText = `⏱️ ${secondsElapsed}s`;
      }, 1000);

      showScreen('playScreen');
      loadCurrentItem();
    }

    function loadCurrentItem() {
      const item = currentRoundItems[currentIndex];
      document.getElementById('progressText').innerText = `${currentIndex + 1} / ${TOTAL_ITEMS}`;
      document.getElementById('targetSymbol').innerText = item.symbol;
      document.getElementById('targetLabel').innerText = item.name;

      speakText(item.name);
    }

    function handleSort(selectedCat, cardElement) {
      if (isProcessing) return;

      const activeItem = currentRoundItems[currentIndex];

      if (selectedCat === activeItem.cat) {
        // --- CORRECT MATCH ---
        isProcessing = true;
        score++;
        document.getElementById('scoreText').innerText = `Score: ${score}`;
        cardElement.classList.add('flash-correct');

        if ('vibrate' in navigator) navigator.vibrate(80);

        sortedHistory.push({
          itemName: activeItem.name,
          itemSymbol: activeItem.symbol,
          categoryName: activeItem.cat === 'food' ? 'Food 🍎' : 'Clothes 👕'
        });

        setTimeout(() => {
          cardElement.classList.remove('flash-correct');
          currentIndex++;

          if (currentIndex < TOTAL_ITEMS) {
            loadCurrentItem();
            isProcessing = false;
          } else {
            endGame();
          }
        }, 400);

      } else {
        // --- WRONG MATCH (Errorless / Guided) ---
        cardElement.classList.add('flash-wrong');
        if ('vibrate' in navigator) navigator.vibrate([100, 50, 100]);
        speakText("Try again");

        setTimeout(() => {
          cardElement.classList.remove('flash-wrong');
        }, 400);
      }
    }

    function endGame() {
      clearInterval(timerInterval);
      showScreen('summaryScreen');

      document.getElementById('finalScore').innerText = `${score} / ${TOTAL_ITEMS}`;
      document.getElementById('finalTime').innerText = `${secondsElapsed}s`;

      speakText("Awesome work! You finished sorting!");

      const grid = document.getElementById('summaryGrid');
      grid.innerHTML = '';

      sortedHistory.forEach(entry => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'summary-item';
        itemDiv.innerHTML = `
          <span style="font-size: 34px;">${entry.itemSymbol}</span>
          <div>
            <div>${entry.itemName}</div>
            <div style="font-size: 14px; color: #4a5568;">${entry.categoryName}</div>
          </div>
        `;
        grid.appendChild(itemDiv);
      });
    }
  </script>
</body>
</html>
