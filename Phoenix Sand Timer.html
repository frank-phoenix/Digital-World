<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phoenix Timer</title>
  <style>
    :root {
      --bg-color: #0f111a;
      --panel-bg: rgba(255, 255, 255, 0.05);
      --accent-color: #ff5722;
      --text-color: #f0f0f5;
      --text-dim: #8888a0;
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      overflow: hidden;
    }

    header {
      text-align: center;
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }

    h1 {
      font-size: 1.8rem;
      letter-spacing: 2px;
      font-weight: 700;
      background: linear-gradient(45deg, var(--accent-color), #ffaa00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls-panel {
      display: flex;
      gap: 15px;
      align-items: center;
      background: var(--panel-bg);
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid var(--glass-border);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 2px solid #fff; border-radius: 50%; }

    select, input[type="number"] {
      background: rgba(0,0,0,0.3);
      color: #fff;
      border: 1px solid var(--glass-border);
      padding: 5px 10px;
      border-radius: 8px;
      outline: none;
    }

    .main-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      flex: 1;
      width: 100%;
      position: relative;
    }

    /* Hourglass Visuals */
    .hourglass-container {
      position: relative;
      width: 220px;
      height: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .glass-frame {
      width: 100%;
      height: 100%;
      position: relative;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
    }

    svg path.glass {
      fill: rgba(255, 255, 255, 0.03);
      stroke: var(--glass-border);
      stroke-width: 4;
    }

    /* Sand containers */
    .sand-top, .sand-bottom {
      position: absolute;
      width: 160px;
      left: 30px;
      overflow: hidden;
      transition: height 0.3s linear;
    }

    .sand-top {
      top: 25px;
      height: 125px;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      background: var(--accent-color);
      transform-origin: top;
    }

    .sand-bottom {
      bottom: 25px;
      height: 0px;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      background: var(--accent-color);
      transform-origin: bottom;
    }

    .sand-stream {
      position: absolute;
      top: 150px;
      left: 109px;
      width: 2px;
      height: 140px;
      background: var(--accent-color);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .sand-stream.active {
      opacity: 1;
    }

    /* Digital Display Side Panel */
    .digital-timer {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background: var(--panel-bg);
      padding: 15px 25px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
    }

    .time-digits {
      font-size: 2.5rem;
      font-weight: 700;
      font-family: monospace;
      letter-spacing: 2px;
    }

    .time-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.96); }

    button.btn-reset {
      background: transparent;
      border: 1px solid var(--glass-border);
      color: var(--text-color);
    }

    /* Next activity section */
    footer {
      width: 100%;
      max-width: 600px;
      margin-bottom: 20px;
      background: var(--panel-bg);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    footer label {
      font-size: 0.85rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    footer input[type="text"] {
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--glass-border);
      color: #fff;
      font-size: 1.1rem;
      padding: 5px 0;
      outline: none;
      transition: border-color 0.3s;
    }

    footer input[type="text"]:focus {
      border-color: var(--accent-color);
    }
  </style>
</head>
<body>

  <header>
    <h1>PHOENIX TIMER</h1>
    <div class="controls-panel">
      <div class="control-group">
        <label>Sand Color</label>
        <input type="color" id="sandColor" value="#ff5722">
      </div>
      <div class="control-group">
        <label>Minutes</label>
        <input type="number" id="timerMinutes" min="1" max="180" value="5" style="width: 60px;">
      </div>
      <div class="control-group">
        <label>Alarm Sound</label>
        <select id="alarmTone">
          <option value="chime">Soft Chime</option>
          <option value="beep">Digital Beep</option>
          <option value="gong">Low Gong</option>
        </select>
      </div>
    </div>
  </header>

  <main class="main-stage">
    <div class="hourglass-container">
      <div class="sand-top" id="sandTop"></div>
      <div class="sand-stream" id="sandStream"></div>
      <div class="sand-bottom" id="sandBottom"></div>
      <svg class="glass-frame" viewBox="0 0 100 160">
        <path class="glass" d="M 10 10 L 90 10 L 55 78 Q 50 85 45 78 L 10 10 Z" />
        <path class="glass" d="M 10 150 L 90 150 L 55 82 Q 50 75 45 82 L 10 150 Z" />
      </svg>
    </div>

    <div class="digital-timer">
      <div class="time-label">Time Remaining</div>
      <div class="time-digits" id="digitalDisplay">05:00</div>
      <div class="action-buttons">
        <button id="startBtn">Start</button>
        <button id="resetBtn" class="btn-reset">Reset</button>
      </div>
    </div>
  </main>

  <footer>
    <label for="nextActivity">What's Next?</label>
    <input type="text" id="nextActivity" placeholder="e.g., Review emails, Take a walk, Stand-up meeting...">
  </footer>

  <script>
    let totalSeconds = 300;
    let remainingSeconds = 300;
    let timerInterval = null;
    let isRunning = false;

    const sandTop = document.getElementById('sandTop');
    const sandBottom = document.getElementById('sandBottom');
    const sandStream = document.getElementById('sandStream');
    const digitalDisplay = document.getElementById('digitalDisplay');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const colorPicker = document.getElementById('sandColor');
    const minutesInput = document.getElementById('timerMinutes');
    const alarmSelect = document.getElementById('alarmTone');

    // Color customization
    colorPicker.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--accent-color', e.target.value);
    });

    // Duration adjustment
    minutesInput.addEventListener('change', () => {
      if(!isRunning) {
        totalSeconds = Math.max(1, parseInt(minutesInput.value) || 1) * 60;
        remainingSeconds = totalSeconds;
        updateDisplay();
      }
    });

    function updateDisplay() {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      digitalDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      
      const progress = remainingSeconds / totalSeconds;
      sandTop.style.height = `${progress * 125}px`;
      sandBottom.style.height = `${(1 - progress) * 125}px`;
    }

    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (remainingSeconds <= 0) return;
      isRunning = true;
      startBtn.textContent = 'Pause';
      sandStream.classList.add('active');

      timerInterval = setInterval(() => {
        remainingSeconds--;
        updateDisplay();

        if (remainingSeconds <= 0) {
          pauseTimer();
          playAlarm(alarmSelect.value);
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      startBtn.textContent = 'Start';
      sandStream.classList.remove('active');
      clearInterval(timerInterval);
    }

    function resetTimer() {
      pauseTimer();
      totalSeconds = Math.max(1, parseInt(minutesInput.value) || 1) * 60;
      remainingSeconds = totalSeconds;
      updateDisplay();
    }

    // Web Audio API Synthesizer for Alarm sound
    function playAlarm(type) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'beep') {
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } else if (type === 'chime') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);
        osc.start();
        osc.stop(ctx.currentTime + 1.5);
      } else if (type === 'gong') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2.5);
        osc.start();
        osc.stop(ctx.currentTime + 2.5);
      }
    }

    startBtn.addEventListener('click', toggleTimer);
    resetBtn.addEventListener('click', resetTimer);
    updateDisplay();
  </script>
</body>
</html>
