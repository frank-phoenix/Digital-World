<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phoenix College Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#120c1c;
    --bg-1:#1d1530;
    --panel:#221934cc;
    --panel-border:rgba(255,178,110,0.16);
    --flame-1:#ff5f3d;
    --flame-2:#f7931e;
    --flame-3:#ffd23f;
    --cream:#f5ead9;
    --lavender:#b6a8cf;
    --lavender-dim:#8577a1;
    --glass-tint:rgba(150,190,230,0.10);
    --glass-hi:rgba(255,255,255,0.35);
    --brass-1:#e6b869;
    --brass-2:#a97a35;
    --danger:#ff4d4d;
    --radius:18px;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, #3a2450 0%, transparent 60%),
      radial-gradient(ellipse 80% 50% at 90% 100%, #2a1a3f 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 60%, var(--bg-0));
    color:var(--cream);
    font-family:'Outfit', sans-serif;
    overflow-x:hidden;
  }

  .app-shell{
    max-width:1400px;
    margin:0 auto;
    padding:28px 28px 60px;
    display:flex;
    flex-direction:column;
    gap:22px;
    min-height:100vh;
  }

  /* ---------- Header ---------- */
  header{
    text-align:center;
    padding:6px 0 4px;
  }
  .brand-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
  }
  .brand-row svg{ width:38px; height:38px; flex-shrink:0; }
  h1{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:clamp(28px, 4.2vw, 46px);
    letter-spacing:0.03em;
    margin:0;
    background:linear-gradient(100deg, var(--flame-3) 0%, var(--flame-2) 45%, var(--flame-1) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 46px rgba(255,120,60,0.25);
  }
  .subtitle{
    margin:6px 0 0;
    font-size:14px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--lavender-dim);
  }

  /* ---------- Main grid ---------- */
  .main-grid{
    display:flex;
    gap:24px;
    align-items:stretch;
    flex-wrap:wrap;
  }

  .hourglass-panel{
    flex:1 1 560px;
    position:relative;
    min-height:560px;
    border-radius:var(--radius);
    background:linear-gradient(160deg, #1b1329 0%, #150f22 100%);
    border:1px solid var(--panel-border);
    box-shadow:inset 0 0 80px rgba(0,0,0,0.4), 0 20px 60px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  .hourglass-panel.glow::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255,120,50,0.28), transparent 70%);
    animation:pulseGlow 1.1s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{opacity:0.35;}
    50%{opacity:0.85;}
  }
  #hourglassCanvas{
    display:block;
    width:100%;
    height:100%;
  }

  .done-banner{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%) translateY(-140%);
    background:linear-gradient(120deg, var(--flame-1), var(--flame-2));
    color:#1a0f08;
    font-family:'Cinzel',serif;
    font-weight:700;
    letter-spacing:0.06em;
    padding:10px 22px;
    border-radius:999px;
    box-shadow:0 10px 30px rgba(255,110,40,0.45);
    transition:transform 0.4s cubic-bezier(.2,1.4,.4,1);
    font-size:14px;
    z-index:5;
    white-space:nowrap;
  }
  .done-banner.show{ transform:translateX(-50%) translateY(0); }

  /* ---------- Controls panel ---------- */
  .controls-panel{
    flex:0 0 350px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    padding:18px 20px;
    backdrop-filter:blur(6px);
  }
  .card h2{
    margin:0 0 12px;
    font-family:'Cinzel',serif;
    font-size:13px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--flame-3);
    font-weight:600;
  }

  /* Digital display */
  .digital-time{
    font-family:'JetBrains Mono', monospace;
    font-size:clamp(38px, 5.4vw, 52px);
    font-weight:700;
    text-align:center;
    letter-spacing:0.04em;
    color:var(--cream);
    text-shadow:0 0 30px rgba(255,160,80,0.25);
    margin:2px 0 10px;
  }
  .progress-track{
    width:100%;
    height:8px;
    border-radius:999px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--flame-1), var(--flame-2), var(--flame-3));
    transition:width 0.25s linear;
  }
  .status-row{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:12px;
    color:var(--lavender-dim);
    letter-spacing:0.05em;
  }

  /* Time setter */
  .time-fields{
    display:flex;
    gap:10px;
  }
  .time-field{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:6px;
    align-items:center;
  }
  .time-field label{
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--lavender-dim);
    text-transform:uppercase;
  }
  .time-field input{
    width:100%;
    background:#160f22;
    border:1px solid var(--panel-border);
    color:var(--cream);
    font-family:'JetBrains Mono', monospace;
    font-size:20px;
    text-align:center;
    border-radius:10px;
    padding:8px 4px;
  }
  .time-field input:focus{
    outline:none;
    border-color:var(--flame-2);
    box-shadow:0 0 0 3px rgba(247,147,30,0.18);
  }
  .presets{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
  }
  .chip{
    background:rgba(255,255,255,0.05);
    border:1px solid var(--panel-border);
    color:var(--lavender);
    font-family:'Outfit',sans-serif;
    font-size:12.5px;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .chip:hover{ background:rgba(255,150,60,0.14); color:var(--flame-3); border-color:rgba(255,150,60,0.4); }

  /* Sand color */
  .swatches{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .swatch{
    width:26px; height:26px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.25);
    cursor:pointer;
    transition:transform 0.15s ease;
  }
  .swatch:hover{ transform:scale(1.15); }
  .swatch.active{ border-color:var(--cream); box-shadow:0 0 0 2px rgba(255,255,255,0.15); }
  input[type="color"]{
    width:36px; height:36px;
    border:none;
    border-radius:50%;
    overflow:hidden;
    background:none;
    cursor:pointer;
    padding:0;
  }
  input[type="color"]::-webkit-color-swatch-wrapper{ padding:0; }
  input[type="color"]::-webkit-color-swatch{ border:2px solid rgba(255,255,255,0.35); border-radius:50%; }

  /* Alarm */
  .row-flex{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  select{
    flex:1;
    background:#160f22;
    color:var(--cream);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:9px 10px;
    font-family:'Outfit',sans-serif;
    font-size:14px;
  }
  select:focus{ outline:none; border-color:var(--flame-2); }
  input[type="range"]{
    flex:1;
    accent-color:var(--flame-2);
  }
  .ghost-btn{
    background:rgba(255,255,255,0.06);
    border:1px solid var(--panel-border);
    color:var(--lavender);
    font-size:12.5px;
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
  }
  .ghost-btn:hover{ background:rgba(255,150,60,0.14); color:var(--flame-3); }

  /* Transport buttons */
  .transport{
    display:flex;
    gap:10px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:14px 10px;
    font-family:'Cinzel',serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.06em;
    cursor:pointer;
    transition:transform 0.12s ease, box-shadow 0.12s ease, opacity .15s ease;
  }
  .btn:active{ transform:scale(0.96); }
  .btn-primary{
    background:linear-gradient(120deg, var(--flame-1), var(--flame-2));
    color:#1a0f08;
    box-shadow:0 10px 26px rgba(255,110,40,0.28);
  }
  .btn-primary:hover{ box-shadow:0 12px 30px rgba(255,120,50,0.42); }
  .btn-secondary{
    background:rgba(255,255,255,0.07);
    color:var(--cream);
    border:1px solid var(--panel-border);
  }
  .btn-secondary:hover{ background:rgba(255,255,255,0.12); }
  .btn[disabled]{ opacity:0.4; cursor:not-allowed; }

  /* What's next */
  .whats-next{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    padding:20px 24px 24px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .whats-next-label{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Cinzel',serif;
    font-size:16px;
    letter-spacing:0.04em;
    color:var(--flame-3);
  }
  .whats-next-label svg{ width:18px; height:18px; }
  textarea{
    width:100%;
    min-height:90px;
    resize:vertical;
    background:#160f22;
    border:1px solid var(--panel-border);
    border-radius:12px;
    color:var(--cream);
    font-family:'Outfit',sans-serif;
    font-size:16px;
    padding:14px 16px;
    line-height:1.5;
  }
  textarea::placeholder{ color:var(--lavender-dim); }
  textarea:focus{
    outline:none;
    border-color:var(--flame-2);
    box-shadow:0 0 0 3px rgba(247,147,30,0.14);
  }

  footer{
    text-align:center;
    color:var(--lavender-dim);
    font-size:12px;
    letter-spacing:0.08em;
    padding-top:6px;
  }

  @media (max-width: 900px){
    .app-shell{ padding:18px 16px 40px; }
    .controls-panel{ flex:1 1 100%; }
    .hourglass-panel{ min-height:440px; flex:1 1 100%; }
  }
</style>
</head>
<body>
<div class="app-shell">

  <header>
    <div class="brand-row">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 4C24 14 14 20 14 32c0 12 8 20 18 24-4-6-6-12-4-18 2 6 8 10 4 2 8 6 14 2 12-8 6 4 8 12 2 20 10-4 18-12 18-24 0-12-10-18-18-28-1 6-3 10-8 12C40 12 36 8 32 4Z"
          fill="url(#pg)"/>
        <defs>
          <linearGradient id="pg" x1="14" y1="4" x2="50" y2="60" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ffd23f"/>
            <stop offset="0.5" stop-color="#f7931e"/>
            <stop offset="1" stop-color="#ff5f3d"/>
          </linearGradient>
        </defs>
      </svg>
      <h1>Phoenix College Timer</h1>
    </div>
    <p class="subtitle">Focus &middot; Rise &middot; Repeat</p>
  </header>

  <div class="main-grid">

    <div class="hourglass-panel" id="hourglassPanel">
      <div class="done-banner" id="doneBanner">Time's up!</div>
      <canvas id="hourglassCanvas"></canvas>
    </div>

    <div class="controls-panel">

      <div class="card">
        <h2>Time Remaining</h2>
        <div class="digital-time" id="digitalTime">05:00</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="status-row">
          <span id="statusText">Ready</span>
          <span id="totalLabel">Total 5:00</span>
        </div>
      </div>

      <div class="card">
        <h2>Set Time</h2>
        <div class="time-fields">
          <div class="time-field">
            <input type="number" id="hoursInput" min="0" max="23" value="0">
            <label>Hours</label>
          </div>
          <div class="time-field">
            <input type="number" id="minutesInput" min="0" max="59" value="5">
            <label>Minutes</label>
          </div>
          <div class="time-field">
            <input type="number" id="secondsInput" min="0" max="59" value="0">
            <label>Seconds</label>
          </div>
        </div>
        <div class="presets">
          <span class="chip" data-secs="30">30s</span>
          <span class="chip" data-secs="60">1m</span>
          <span class="chip" data-secs="300">5m</span>
          <span class="chip" data-secs="600">10m</span>
          <span class="chip" data-secs="900">15m</span>
          <span class="chip" data-secs="1500">25m</span>
        </div>
      </div>

      <div class="card">
        <h2>Sand Colour</h2>
        <div class="swatches">
          <input type="color" id="colorPicker" value="#ffb454">
          <span class="swatch active" data-color="#ffb454" style="background:#ffb454"></span>
          <span class="swatch" data-color="#f2d18c" style="background:#f2d18c"></span>
          <span class="swatch" data-color="#ff8c69" style="background:#ff8c69"></span>
          <span class="swatch" data-color="#7ec8e3" style="background:#7ec8e3"></span>
          <span class="swatch" data-color="#c792ea" style="background:#c792ea"></span>
          <span class="swatch" data-color="#8de38d" style="background:#8de38d"></span>
        </div>
      </div>

      <div class="card">
        <h2>Alarm</h2>
        <div class="row-flex">
          <select id="alarmSelect">
            <option value="chime">Chime</option>
            <option value="bell">Soft Bell</option>
            <option value="beep">Digital Beep</option>
            <option value="gong">Gong</option>
            <option value="none">Silent</option>
          </select>
          <button class="ghost-btn" id="testAlarmBtn">Test</button>
        </div>
        <div class="row-flex">
          <span style="font-size:12px;color:var(--lavender-dim);">Vol</span>
          <input type="range" id="volumeSlider" min="0" max="100" value="70">
        </div>
      </div>

      <div class="transport">
        <button class="btn btn-primary" id="startBtn">Start</button>
        <button class="btn btn-secondary" id="pauseBtn" disabled>Pause</button>
        <button class="btn btn-secondary" id="resetBtn">Reset</button>
      </div>

    </div>
  </div>

  <div class="whats-next">
    <div class="whats-next-label">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 12h14M13 6l6 6-6 6" stroke="#f7931e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      What's next:
    </div>
    <textarea id="whatsNext" placeholder="Type what happens after this timer ends..."></textarea>
  </div>

  <footer>Phoenix College &middot; Timer Tool</footer>

</div>

<script>
(function(){
  "use strict";

  /* ============ Elements ============ */
  const canvas = document.getElementById('hourglassCanvas');
  const ctx = canvas.getContext('2d');
  const panel = document.getElementById('hourglassPanel');
  const doneBanner = document.getElementById('doneBanner');

  const digitalTimeEl = document.getElementById('digitalTime');
  const progressFillEl = document.getElementById('progressFill');
  const statusTextEl = document.getElementById('statusText');
  const totalLabelEl = document.getElementById('totalLabel');

  const hoursInput = document.getElementById('hoursInput');
  const minutesInput = document.getElementById('minutesInput');
  const secondsInput = document.getElementById('secondsInput');
  const presetChips = document.querySelectorAll('.chip');

  const colorPicker = document.getElementById('colorPicker');
  const swatches = document.querySelectorAll('.swatch');

  const alarmSelect = document.getElementById('alarmSelect');
  const testAlarmBtn = document.getElementById('testAlarmBtn');
  const volumeSlider = document.getElementById('volumeSlider');

  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');

  const whatsNextEl = document.getElementById('whatsNext');

  /* ============ Persisted "What's next" text ============ */
  try{
    const saved = localStorage.getItem('phoenixTimerWhatsNext');
    if(saved) whatsNextEl.value = saved;
  }catch(e){}
  whatsNextEl.addEventListener('input', function(){
    try{ localStorage.setItem('phoenixTimerWhatsNext', whatsNextEl.value); }catch(e){}
  });

  /* ============ Timer state ============ */
  let totalSeconds = 300;
  let remainingSeconds = 300;
  let isRunning = false;
  let lastTs = null;
  let rafId = null;
  let sandColor = '#ffb454';

  function clampInt(v, min, max){
    v = parseInt(v, 10);
    if(isNaN(v)) v = min;
    return Math.min(max, Math.max(min, v));
  }

  function readTimeInputs(){
    const h = clampInt(hoursInput.value, 0, 23);
    const m = clampInt(minutesInput.value, 0, 59);
    const s = clampInt(secondsInput.value, 0, 59);
    hoursInput.value = h; minutesInput.value = m; secondsInput.value = s;
    return h*3600 + m*60 + s;
  }

  function secondsToParts(total){
    total = Math.max(0, Math.round(total));
    const h = Math.floor(total/3600);
    const m = Math.floor((total%3600)/60);
    const s = total%60;
    return {h,m,s};
  }

  function formatTime(total){
    const p = secondsToParts(total);
    if(p.h > 0 || totalSeconds >= 3600){
      return String(p.h).padStart(2,'0') + ':' + String(p.m).padStart(2,'0') + ':' + String(p.s).padStart(2,'0');
    }
    return String(p.m).padStart(2,'0') + ':' + String(p.s).padStart(2,'0');
  }

  function updateDigitalDisplay(){
    digitalTimeEl.textContent = formatTime(remainingSeconds);
    const progress = totalSeconds > 0 ? (1 - remainingSeconds/totalSeconds) : 0;
    progressFillEl.style.width = (progress*100).toFixed(2) + '%';
    totalLabelEl.textContent = 'Total ' + formatTime(totalSeconds);
  }

  function setTotalFromInputs(){
    if(isRunning) return;
    const t = readTimeInputs();
    totalSeconds = Math.max(1, t);
    remainingSeconds = totalSeconds;
    updateDigitalDisplay();
    drawHourglass(0);
    statusTextEl.textContent = 'Ready';
  }

  function applyPresetSeconds(secs){
    if(isRunning) return;
    const p = secondsToParts(secs);
    hoursInput.value = p.h; minutesInput.value = p.m; secondsInput.value = p.s;
    setTotalFromInputs();
  }

  presetChips.forEach(function(chip){
    chip.addEventListener('click', function(){
      applyPresetSeconds(parseInt(chip.dataset.secs,10));
    });
  });
  [hoursInput, minutesInput, secondsInput].forEach(function(inp){
    inp.addEventListener('change', setTotalFromInputs);
  });

  /* ============ Sand colour ============ */
  function setSandColor(c){
    sandColor = c;
    colorPicker.value = c;
    swatches.forEach(function(s){ s.classList.toggle('active', s.dataset.color.toLowerCase() === c.toLowerCase()); });
    drawHourglass(totalSeconds>0 ? (1-remainingSeconds/totalSeconds) : 0);
  }
  colorPicker.addEventListener('input', function(){ setSandColor(colorPicker.value); });
  swatches.forEach(function(s){
    s.addEventListener('click', function(){ setSandColor(s.dataset.color); });
  });

  /* ============ Audio / Alarm ============ */
  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(ac, freq, startTime, duration, opts){
    opts = opts || {};
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(freq, startTime);
    const peak = (opts.peak !== undefined ? opts.peak : 0.3);
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(Math.max(peak,0.0005), startTime + (opts.attack || 0.02));
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
  }

  function playAlarm(type){
    type = type || alarmSelect.value;
    if(type === 'none') return;
    const ac = getAudioCtx();
    const vol = (parseInt(volumeSlider.value,10)/100);
    const now = ac.currentTime;

    if(type === 'chime'){
      const notes = [880, 1108.73, 1318.51];
      notes.forEach(function(f, i){
        playTone(ac, f, now + i*0.18, 1.1, {type:'sine', peak:0.28*vol, attack:0.01});
        playTone(ac, f*2, now + i*0.18, 0.7, {type:'sine', peak:0.06*vol, attack:0.01});
      });
    } else if(type === 'bell'){
      [0, 0.9].forEach(function(t){
        playTone(ac, 880, now + t, 1.4, {type:'sine', peak:0.3*vol, attack:0.005});
        playTone(ac, 1760, now + t, 0.9, {type:'sine', peak:0.08*vol, attack:0.005});
      });
    } else if(type === 'beep'){
      for(let i=0;i<5;i++){
        playTone(ac, 1046.5, now + i*0.28, 0.16, {type:'square', peak:0.22*vol, attack:0.005});
      }
    } else if(type === 'gong'){
      playTone(ac, 110, now, 2.6, {type:'sine', peak:0.35*vol, attack:0.02});
      playTone(ac, 164.8, now, 2.2, {type:'sine', peak:0.14*vol, attack:0.02});
      playTone(ac, 73, now, 3.0, {type:'sine', peak:0.18*vol, attack:0.05});
    }
  }

  testAlarmBtn.addEventListener('click', function(){ playAlarm(alarmSelect.value); });

  /* ============ Transport ============ */
  function setRunningUI(running){
    startBtn.disabled = running;
    pauseBtn.disabled = !running;
    hoursInput.disabled = running;
    minutesInput.disabled = running;
    secondsInput.disabled = running;
    statusTextEl.textContent = running ? 'Running' : (remainingSeconds<=0 ? 'Complete' : 'Paused');
  }

  function startTimer(){
    if(remainingSeconds <= 0){
      remainingSeconds = totalSeconds;
    }
    if(remainingSeconds <= 0) return;
    getAudioCtx();
    isRunning = true;
    lastTs = null;
    setRunningUI(true);
    doneBanner.classList.remove('show');
    panel.classList.remove('glow');
    rafId = requestAnimationFrame(tick);
  }

  function pauseTimer(){
    isRunning = false;
    setRunningUI(false);
    if(rafId) cancelAnimationFrame(rafId);
  }

  function resetTimer(){
    isRunning = false;
    if(rafId) cancelAnimationFrame(rafId);
    remainingSeconds = totalSeconds;
    lastTs = null;
    updateDigitalDisplay();
    drawHourglass(0);
    setRunningUI(false);
    doneBanner.classList.remove('show');
    panel.classList.remove('glow');
    fallingParticles.length = 0;
  }

  startBtn.addEventListener('click', startTimer);
  pauseBtn.addEventListener('click', pauseTimer);
  resetBtn.addEventListener('click', resetTimer);

  function tick(ts){
    if(!isRunning) return;
    if(lastTs === null) lastTs = ts;
    const dt = (ts - lastTs) / 1000;
    lastTs = ts;

    remainingSeconds -= dt;
    if(remainingSeconds <= 0){
      remainingSeconds = 0;
      isRunning = false;
      updateDigitalDisplay();
      drawHourglass(1);
      setRunningUI(false);
      statusTextEl.textContent = 'Complete';
      doneBanner.classList.add('show');
      panel.classList.add('glow');
      playAlarm(alarmSelect.value);
      setTimeout(function(){ panel.classList.remove('glow'); }, 6000);
      return;
    }

    updateDigitalDisplay();
    const progress = 1 - remainingSeconds/totalSeconds;
    drawHourglass(progress);
    rafId = requestAnimationFrame(tick);
  }

  /* ============ Canvas sizing ============ */
  let cw = 0, ch = 0, dpr = 1;
  function resizeCanvas(){
    const rect = panel.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    cw = rect.width;
    ch = rect.height;
    canvas.width = Math.round(cw*dpr);
    canvas.height = Math.round(ch*dpr);
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const progress = totalSeconds>0 ? (1-remainingSeconds/totalSeconds) : 0;
    drawHourglass(progress);
  }
  window.addEventListener('resize', resizeCanvas);

  /* ============ Colour helpers ============ */
  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length===3) hex = hex.split('').map(function(c){return c+c;}).join('');
    const num = parseInt(hex,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }
  function rgba(hex, a){
    const c = hexToRgb(hex);
    return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')';
  }
  function shade(hex, amt){
    const c = hexToRgb(hex);
    function clip(v){ return Math.min(255, Math.max(0, v)); }
    const r = clip(c.r + amt), g = clip(c.g + amt), b = clip(c.b + amt);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  /* ============ Sand particle stream ============ */
  const fallingParticles = [];
  let spawnAccumulator = 0;

  /* ============ Geometry + drawing ============ */
  function getGeometry(){
    const marginTop = 46, marginBottom = 46;
    const usableH = ch - marginTop - marginBottom;
    const glassHeight = Math.min(usableH, ch*0.82);
    const topY = (ch - glassHeight)/2;
    const bottomY = topY + glassHeight;
    const neckY = (topY + bottomY)/2;
    const cx = cw/2;
    const bulbHalfWidth = Math.min(cw*0.30, glassHeight*0.34);
    const neckHalfWidth = Math.max(4, bulbHalfWidth*0.05);
    return {topY, bottomY, neckY, cx, bulbHalfWidth, neckHalfWidth, glassHeight};
  }

  function topBulbPath(g){
    const {topY, neckY, cx, bulbHalfWidth:hw, neckHalfWidth:nhw} = g;
    const bulbH = neckY - topY;
    const p = new Path2D();
    p.moveTo(cx-hw, topY+hw*0.14);
    p.quadraticCurveTo(cx-hw, topY, cx-hw*0.45, topY);
    p.lineTo(cx+hw*0.45, topY);
    p.quadraticCurveTo(cx+hw, topY, cx+hw, topY+hw*0.14);
    p.bezierCurveTo(cx+hw, topY+bulbH*0.55, cx+nhw*3.2, neckY-bulbH*0.22, cx+nhw, neckY);
    p.lineTo(cx-nhw, neckY);
    p.bezierCurveTo(cx-nhw*3.2, neckY-bulbH*0.22, cx-hw, topY+bulbH*0.55, cx-hw, topY+hw*0.14);
    p.closePath();
    return p;
  }

  function bottomBulbPath(g){
    const {bottomY, neckY, cx, bulbHalfWidth:hw, neckHalfWidth:nhw} = g;
    const bulbH = bottomY - neckY;
    const p = new Path2D();
    p.moveTo(cx-nhw, neckY);
    p.bezierCurveTo(cx-nhw*3.2, neckY+bulbH*0.22, cx-hw, bottomY-bulbH*0.55, cx-hw, bottomY-hw*0.14);
    p.quadraticCurveTo(cx-hw, bottomY, cx-hw*0.45, bottomY);
    p.lineTo(cx+hw*0.45, bottomY);
    p.quadraticCurveTo(cx+hw, bottomY, cx+hw, bottomY-hw*0.14);
    p.bezierCurveTo(cx+hw, bottomY-bulbH*0.55, cx+nhw*3.2, neckY+bulbH*0.22, cx+nhw, neckY);
    p.closePath();
    return p;
  }

  function drawFrame(g){
    const {topY, bottomY, cx, bulbHalfWidth:hw} = g;
    const capW = hw*2 + 46;
    const capH = 16;
    const brassGrad = ctx.createLinearGradient(0, topY-capH, 0, topY);
    brassGrad.addColorStop(0, '#f5d9a0');
    brassGrad.addColorStop(0.5, '#c8933f');
    brassGrad.addColorStop(1, '#8a5b22');

    function roundRect(x,y,w,h,r){
      ctx.beginPath();
      ctx.moveTo(x+r,y);
      ctx.arcTo(x+w,y,x+w,y+h,r);
      ctx.arcTo(x+w,y+h,x,y+h,r);
      ctx.arcTo(x,y+h,x,y,r);
      ctx.arcTo(x,y,x+w,y,r);
      ctx.closePath();
    }

    // top cap
    ctx.fillStyle = brassGrad;
    roundRect(cx-capW/2, topY-capH, capW, capH, 6);
    ctx.fill();
    // bottom cap
    const brassGrad2 = ctx.createLinearGradient(0, bottomY, 0, bottomY+capH);
    brassGrad2.addColorStop(0, '#8a5b22');
    brassGrad2.addColorStop(0.5, '#c8933f');
    brassGrad2.addColorStop(1, '#f5d9a0');
    ctx.fillStyle = brassGrad2;
    roundRect(cx-capW/2, bottomY, capW, capH, 6);
    ctx.fill();

    // side pillars
    const pillarW = 6;
    const pillarInset = capW/2 - 14;
    [-1,1].forEach(function(dir){
      const px = cx + dir*pillarInset;
      const pg = ctx.createLinearGradient(px-pillarW/2,0,px+pillarW/2,0);
      pg.addColorStop(0,'#7a4f1e');
      pg.addColorStop(0.5,'#e6b869');
      pg.addColorStop(1,'#7a4f1e');
      ctx.fillStyle = pg;
      roundRect(px-pillarW/2, topY-2, pillarW, (bottomY+capH+2)-(topY-2), 3);
      ctx.fill();
    });

    // small wing flourish above and below
    function wing(cx0, y0, flip){
      ctx.save();
      ctx.translate(cx0, y0);
      ctx.scale(1, flip);
      ctx.beginPath();
      ctx.moveTo(-34, 0);
      ctx.quadraticCurveTo(-14,-16, 0,-4);
      ctx.quadraticCurveTo(14,-16, 34,0);
      ctx.quadraticCurveTo(14,-2, 0,6);
      ctx.quadraticCurveTo(-14,-2, -34,0);
      ctx.closePath();
      const wg = ctx.createLinearGradient(-34,0,34,0);
      wg.addColorStop(0,'#ff5f3d');
      wg.addColorStop(0.5,'#ffd23f');
      wg.addColorStop(1,'#ff5f3d');
      ctx.fillStyle = wg;
      ctx.globalAlpha = 0.85;
      ctx.fill();
      ctx.restore();
    }
    wing(cx, topY-capH-2, 1);
    wing(cx, bottomY+capH+2, -1);
  }

  function drawGlassOutline(path){
    ctx.save();
    ctx.strokeStyle = 'rgba(200,220,255,0.35)';
    ctx.lineWidth = 2;
    ctx.stroke(path);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 5;
    ctx.globalCompositeOperation = 'lighter';
    ctx.stroke(path);
    ctx.restore();
  }

  function drawHourglass(progress){
    if(!cw || !ch) return;
    progress = Math.min(1, Math.max(0, progress));
    ctx.clearRect(0,0,cw,ch);

    const g = getGeometry();
    const topPath = topBulbPath(g);
    const bottomPath = bottomBulbPath(g);

    // ambient glow behind bottom bulb when running
    if(isRunning){
      const glowGrad = ctx.createRadialGradient(g.cx, g.bottomY-g.bulbHalfWidth*0.5, 10, g.cx, g.bottomY-g.bulbHalfWidth*0.5, g.bulbHalfWidth*1.6);
      glowGrad.addColorStop(0, rgba('#ff8c42', 0.16));
      glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0,0,cw,ch);
    }

    drawFrame(g);

    // glass fill tint
    ctx.save();
    ctx.clip(topPath);
    ctx.fillStyle = 'rgba(150,190,230,0.06)';
    ctx.fillRect(g.cx-g.bulbHalfWidth-4, g.topY-4, (g.bulbHalfWidth+4)*2, g.glassHeight/2+8);
    ctx.restore();
    ctx.save();
    ctx.clip(bottomPath);
    ctx.fillStyle = 'rgba(150,190,230,0.06)';
    ctx.fillRect(g.cx-g.bulbHalfWidth-4, g.neckY, (g.bulbHalfWidth+4)*2, g.glassHeight/2+8);
    ctx.restore();

    /* ---- TOP sand (draining) ---- */
    const bulbH = g.neckY - g.topY;
    const topSurfaceY = g.topY + bulbH*progress;
    ctx.save();
    ctx.clip(topPath);
    const topGrad = ctx.createLinearGradient(0, topSurfaceY, 0, g.neckY);
    topGrad.addColorStop(0, shade(sandColor, 26));
    topGrad.addColorStop(1, shade(sandColor, -18));
    ctx.fillStyle = topGrad;
    ctx.beginPath();
    ctx.moveTo(g.cx-g.bulbHalfWidth-4, topSurfaceY);
    // slight concave dip toward neck for the funnel look
    ctx.quadraticCurveTo(g.cx, topSurfaceY + Math.min(14, bulbH*0.05), g.cx+g.bulbHalfWidth+4, topSurfaceY);
    ctx.lineTo(g.cx+g.bulbHalfWidth+4, g.neckY+2);
    ctx.lineTo(g.cx-g.bulbHalfWidth-4, g.neckY+2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    /* ---- BOTTOM sand (piling) ---- */
    const bulbH2 = g.bottomY - g.neckY;
    const fillTopY = g.bottomY - bulbH2*progress;
    ctx.save();
    ctx.clip(bottomPath);
    const botGrad = ctx.createLinearGradient(0, fillTopY, 0, g.bottomY);
    botGrad.addColorStop(0, shade(sandColor, 22));
    botGrad.addColorStop(1, shade(sandColor, -22));
    ctx.fillStyle = botGrad;

    // mound peak height scales with remaining flow, shrinks near start/end
    const peakActive = progress > 0.003 && progress < 0.999;
    const peakH = peakActive ? Math.min(26, bulbH2*0.14) : 4;
    const localHalfW = Math.max(g.neckHalfWidth*2.5, (g.bulbHalfWidth) * (1 - (g.bottomY-fillTopY)/bulbH2) * 0.9 + 14);

    ctx.beginPath();
    ctx.moveTo(g.cx-g.bulbHalfWidth-4, fillTopY+peakH);
    ctx.lineTo(g.cx-Math.min(localHalfW, g.bulbHalfWidth*0.9), fillTopY+peakH);
    ctx.quadraticCurveTo(g.cx, fillTopY-peakH, g.cx+Math.min(localHalfW, g.bulbHalfWidth*0.9), fillTopY+peakH);
    ctx.lineTo(g.cx+g.bulbHalfWidth+4, fillTopY+peakH);
    ctx.lineTo(g.cx+g.bulbHalfWidth+4, g.bottomY+4);
    ctx.lineTo(g.cx-g.bulbHalfWidth-4, g.bottomY+4);
    ctx.closePath();
    ctx.fill();

    // subtle texture speckles on pile surface
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = shade(sandColor, -40);
    for(let i=0;i<14;i++){
      const tx = g.cx - localHalfW + (i/13)*localHalfW*2 + Math.sin(i*13.1)*4;
      const ty = fillTopY + peakH*0.4 + Math.abs(Math.sin(i*7.7))*6;
      ctx.beginPath();
      ctx.ellipse(tx, ty, 3, 1.2, 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    /* ---- falling stream ---- */
    if(isRunning && progress > 0.001 && progress < 0.999){
      spawnAccumulator += 1;
      if(spawnAccumulator >= 2){
        spawnAccumulator = 0;
        fallingParticles.push({
          x: g.cx + (Math.random()-0.5)*g.neckHalfWidth*0.8,
          y: g.neckY,
          vy: 3.4 + Math.random()*1.6,
          size: 1 + Math.random()*1.4,
          wob: Math.random()*Math.PI*2
        });
      }
      // stream core line
      ctx.save();
      ctx.strokeStyle = rgba(sandColor, 0.55);
      ctx.lineWidth = Math.max(1.4, g.neckHalfWidth*0.7);
      ctx.beginPath();
      ctx.moveTo(g.cx, g.neckY-6);
      ctx.lineTo(g.cx, fillTopY);
      ctx.stroke();
      ctx.restore();

      for(let i=fallingParticles.length-1; i>=0; i--){
        const p = fallingParticles[i];
        p.y += p.vy;
        p.wob += 0.2;
        if(p.y >= fillTopY){ fallingParticles.splice(i,1); continue; }
        ctx.beginPath();
        ctx.fillStyle = rgba(sandColor, 0.9);
        ctx.ellipse(p.x + Math.sin(p.wob)*0.6, p.y, p.size, p.size*0.85, 0, 0, Math.PI*2);
        ctx.fill();
      }
    } else if(!isRunning){
      fallingParticles.length = 0;
    }

    /* ---- neck glint ---- */
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.ellipse(g.cx, g.neckY, g.neckHalfWidth*1.4, 2.5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    /* ---- glass outlines + highlight ---- */
    drawGlassOutline(topPath);
    drawGlassOutline(bottomPath);

    // glossy highlight streak
    [topPath, bottomPath].forEach(function(path){
      ctx.save();
      ctx.clip(path);
      const hi = ctx.createLinearGradient(g.cx-g.bulbHalfWidth, 0, g.cx-g.bulbHalfWidth*0.35, 0);
      hi.addColorStop(0, 'rgba(255,255,255,0.22)');
      hi.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hi;
      ctx.fillRect(g.cx-g.bulbHalfWidth, g.topY-10, g.bulbHalfWidth*0.7, g.glassHeight+20);
      ctx.restore();
    });
  }

  /* ============ Init ============ */
  function init(){
    setTotalFromInputs();
    resizeCanvas();
    setRunningUI(false);
    statusTextEl.textContent = 'Ready';
    updateDigitalDisplay();
  }
  window.addEventListener('load', function(){
    resizeCanvas();
    init();
  });
  // In case load already fired
  if(document.readyState === 'complete'){
    resizeCanvas();
    init();
  }
})();
</script>
</body>
</html>
